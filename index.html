<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Dashboard</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            color: #38bdf8;
            /* 네온 효과 제거 */
            margin-bottom: 40px;
        }

        .section-title {
            width: 100%;
            max-width: 800px;
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #334155;
            color: #94a3b8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        .symbol {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 10px;
        }

        .price {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 2px;
        }
        
        /* 원화 가격 스타일 추가 */
        .krw-price {
            font-size: 0.9rem;
            color: #94a3b8; /* 조금 흐린 색 */
            margin-bottom: 10px;
        }

        .change {
            font-size: 1rem;
            font-weight: bold;
        }

        /* 등락률 색상 */
        .up {
            color: #4ade80; /* 초록색 (상승) */
            text-shadow: 0 0 5px rgba(74, 222, 128, 0.4);
        }

        .down {
            color: #f87171; /* 빨간색 (하락) */
            text-shadow: 0 0 5px rgba(248, 113, 113, 0.4);
        }

        .loading {
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>📈 My Crypto Dashboard</h1>

    <!-- 코인 섹션 -->
    <div class="section-title">🪙 Crypto (Binance Live)</div>
    <div class="grid" id="crypto-grid">
        <!-- 자바스크립트로 카드가 생성됩니다 -->
    </div>

    <script>
        // ==========================================
        // 1. 설정 (원하는 종목으로 변경하세요!)
        // ==========================================
        
        // 코인 심볼 (바이낸스 기준: 종목+USDT)
        const cryptoSymbols = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT'];
        let currentExchangeRate = 1350; // 기본 환율 (API 로드 실패 대비)

        // UI 카드 최초 생성 함수
        function initCards() {
            const grid = document.getElementById('crypto-grid');
            cryptoSymbols.forEach(symbol => {
                const displaySymbol = symbol.replace('USDT', '');
                const card = document.createElement('div');
                card.className = 'card';
                card.id = symbol;
                card.innerHTML = `
                    <div class="symbol">${displaySymbol}</div>
                    <div class="price" id="${symbol}-price"><span class="loading">Loading...</span></div>
                    <div class="krw-price" id="${symbol}-krw"></div>
                    <div class="change" id="${symbol}-change"></div>
                `;
                grid.appendChild(card);
            });
        }

        function updateCard(id, price, changePercent) {
            const priceEl = document.getElementById(`${id}-price`);
            const krwEl = document.getElementById(`${id}-krw`);
            const changeEl = document.getElementById(`${id}-change`);
            
            const numPrice = parseFloat(price);
            
            // 달러 가격 포맷팅 (소수점 처리)
            const formattedPrice = numPrice < 10 ? numPrice.toFixed(4) : numPrice.toFixed(2);
            priceEl.innerText = `$${formattedPrice}`;

            // 원화 가격 포맷팅 및 계산
            const krwPrice = numPrice * currentExchangeRate;
            // XRP 같이 저렴한 코인은 소수점 2자리까지, 비트코인 등은 정수로 콤마 찍기
            const formattedKrw = krwPrice < 1000 ? krwPrice.toFixed(2) : Math.floor(krwPrice).toLocaleString();
            krwEl.innerText = `₩${formattedKrw}`;

            // 등락률 색상 및 기호 처리
            const isUp = parseFloat(changePercent) >= 0;
            const sign = isUp ? '+' : '';
            changeEl.innerText = `${sign}${parseFloat(changePercent).toFixed(2)}%`;
            changeEl.className = `change ${isUp ? 'up' : 'down'}`;
        }

        // 환율 정보 가져오기 (Open Exchange Rates API 사용 - 무료)
        async function fetchExchangeRate() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                if(data && data.rates && data.rates.KRW) {
                    currentExchangeRate = data.rates.KRW;
                }
            } catch (error) {
                console.error("환율 데이터를 불러오는데 실패했습니다.", error);
            }
        }

        // 바이낸스 API로 코인 시세 가져오기
        async function fetchCrypto() {
            try {
                for (const symbol of cryptoSymbols) {
                    const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
                    const data = await response.json();
                    updateCard(symbol, data.lastPrice, data.priceChangePercent);
                }
            } catch (error) {
                console.error("코인 데이터를 불러오는데 실패했습니다.", error);
            }
        }

        // 메인 실행 함수
        async function startDashboard() {
            initCards(); // 처음에 카드를 한 번만 그림
            await fetchExchangeRate(); // 환율을 먼저 가져옴
            fetchCrypto(); // 코인 가격 렌더링
            
            // 10초마다 코인 가격 새로고침
            setInterval(fetchCrypto, 10000);
            
            // 환율은 변동폭이 작으므로 1시간(3600000ms)마다 새로고침
            setInterval(fetchExchangeRate, 3600000);
        }

        startDashboard();
    </script>
</body>
</html>
